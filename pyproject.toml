[project]
name = "langgraph-medical-center"
version = "1.0.0"
description = "Sistema de agentes médicos especializados con orquestación paralela usando LangGraph, GPT-5.1 y PostgreSQL"
authors = [
    {name = "Medical AI Team", email = "medical-ai@example.com"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.13"
keywords = ["langgraph", "medical", "ai", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LangGraph and LangChain
    "langgraph==0.2.45",
    "langchain==0.3.10",
    "langchain-openai==0.2.9",
    "langchain-community==0.3.10",

    # OpenAI
    "openai==1.57.4",

    # Database - PostgreSQL
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",

    # FastAPI Web Framework
    "fastapi[standard]==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.18",
    "websockets==14.1",
    "jinja2==3.1.4",

    # Configuration Management
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # Async Support
    "aiohttp==3.11.10",

    # Data Validation and Serialization
    "marshmallow==3.23.2",

    # Logging
    "loguru==0.7.3",

    # Utilities
    "python-dateutil==2.9.0.post0",
    "tenacity==9.0.0",

    # Additional dependencies for production
    "httpx==0.28.1",  # For testing async requests
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",

    # Type Checking
    "mypy==1.13.0",
    "types-requests==2.32.0.20241016",

    # Code Quality
    "black==24.10.0",
    "ruff==0.8.4",

    # Pre-commit hooks
    "pre-commit>=3.5.0",
]

[project.scripts]
medical-server = "src.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# RUFF - Linting & Formatting
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "venv",
    ".venv",
    "logs",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (Pydantic uses this)
    "UP007",  # Use X | Y for type annotations (keep Optional for clarity)
    "RUF001", # String contains ambiguous unicode characters (emojis are OK)
    "RUF010", # Use explicit conversion flag (f-strings are fine)
    "RUF012", # Mutable class attributes (we know what we're doing)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*.py" = ["ARG"]  # Unused arguments in tests are OK

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# MYPY - Type Checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Flask decorators
disallow_any_generics = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "eventlet.*",
    "flask_socketio.*",
    "marshmallow.*",
    "loguru.*",
]
ignore_missing_imports = true

# ============================================================================
# PYTEST - Testing
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=70",
    "-p", "no:warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# BLACK - Formatting (legacy, Ruff replaces this)
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | __pycache__
  | venv
  | \.venv
  | logs
)/
'''

# ============================================================================
# COVERAGE
# ============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
