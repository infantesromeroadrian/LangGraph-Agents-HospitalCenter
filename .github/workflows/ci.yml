name: CI - Lint, Test & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================================
  # JOB 1: LINT & CODE QUALITY
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3

      - name: 📦 Install dependencies
        run: |
          uv sync --frozen
          uv pip install ruff mypy bandit[toml] safety

      - name: 🧹 Run Ruff (linter)
        run: |
          source .venv/bin/activate
          ruff check src/ tests/
        continue-on-error: true  # No fallar el build por warnings

      - name: 🎨 Run Ruff (formatter check)
        run: |
          source .venv/bin/activate
          ruff format --check src/ tests/
        continue-on-error: true

      - name: 🔍 Run mypy (type checker)
        run: |
          source .venv/bin/activate
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Mypy muy estricto, no bloquear

  # ============================================================================
  # JOB 2: TESTS & COVERAGE
  # ============================================================================
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: medical_user
          POSTGRES_PASSWORD: medical_password
          POSTGRES_DB: medical_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3

      - name: 📦 Install dependencies
        run: |
          uv sync --frozen
          uv pip install pytest pytest-cov pytest-asyncio

      - name: 🧪 Run pytest
        env:
          DATABASE_URL: postgresql://medical_user:medical_password@localhost:5432/medical_db
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source .venv/bin/activate
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        continue-on-error: false  # Tests DEBEN pasar

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ============================================================================
  # JOB 3: SECURITY SCAN
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3

      - name: 📦 Install dependencies
        run: |
          uv sync --frozen
          uv pip install bandit[toml] safety

      - name: 🔒 Run Bandit (security linter)
        run: |
          source .venv/bin/activate
          bandit -r src/ -ll -ii
        continue-on-error: true

      - name: 🛡️ Run Safety (dependency vulnerabilities)
        run: |
          source .venv/bin/activate
          safety check --json
        continue-on-error: true

      - name: 🔍 Run Trivy (container scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # No fallar, solo reportar

  # ============================================================================
  # JOB 4: DOCKER BUILD TEST
  # ============================================================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: langgraph-medical:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Test Docker image
        run: |
          docker run --rm langgraph-medical:test python -c "import sys; print(f'Python {sys.version}')"

  # ============================================================================
  # JOB 5: BUILD SUCCESS NOTIFICATION
  # ============================================================================
  notify:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker]
    if: always()
    
    steps:
      - name: ✅ All checks passed
        if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' && needs.docker.result == 'success' }}
        run: |
          echo "🎉 All CI checks passed! Ready to deploy."

      - name: ❌ Some checks failed
        if: ${{ needs.lint.result != 'success' || needs.test.result != 'success' || needs.security.result != 'success' || needs.docker.result != 'success' }}
        run: |
          echo "⚠️ Some CI checks failed. Review the logs above."
          exit 1
